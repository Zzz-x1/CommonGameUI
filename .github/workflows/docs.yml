name: Documentation
on:
  pull_request:
    paths: ['AGENTS.md', 'README.md', 'docs/**', 'Demo/**/README.md', 'Demo/**/SOURCES.md', 'scripts/Check-Docs.mjs', 'scripts/Test-Docs-Browser.mjs', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
        working-directory: docs/site
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name == 'workflow_dispatch'
      - run: npm run docs:build
        working-directory: docs/site
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: docs/site/.vitepress/dist
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
